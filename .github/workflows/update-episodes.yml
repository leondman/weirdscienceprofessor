name: Update episodes
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_episodes.py
      - name: Commit if changed
        run: |
          git config user.name "episode-bot"
          git config user.email "episode-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto-update episodes from YouTube" && git push)
